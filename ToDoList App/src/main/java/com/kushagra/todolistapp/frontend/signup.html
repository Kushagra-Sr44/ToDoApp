<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>

    <style>
        body {
          margin: 0;
          font-family: Arial;
          background: #f2f2f2;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }

        .box {
          background: white;
          padding: 25px;
          width: 300px;
          border-radius: 8px;
        }

        h2 {
          text-align: center;
          margin-bottom: 20px;
        }

        .field {
          margin-bottom: 12px;
        }

        input[type="text"],
        input[type="password"] {
          width: 100%;
          padding: 10px;
          border: 1px solid #ccc;
          border-radius: 5px;
          box-sizing: border-box;
        }

        label {
          font-size: 12px;
        }

        .toggle {
          font-size: 12px;
          cursor: pointer;
          color: blue;
          display: inline-block;
          margin-bottom: 10px;
        }

        .terms {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 12px;
          margin-bottom: 12px;
        }

        button {
          width: 100%;
          padding: 10px;
          background: #0070f3;
          color: white;
          border: none;
          cursor: pointer;
          border-radius: 5px;
          text-decoration:none;
        }
        button a{
                  text-decoration:none;
                  color:white;

        }
        button:hover {
          background: #005bb5;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Sign Up</h2>

    <div class="field">
        <input type="text" id="name" placeholder="Full Name">
    </div>

    <div class="field">
        <input type="password" id="password" placeholder="Password">
    </div>

    <span class="toggle" onclick="togglePassword()">Show Password</span>

    <div class="terms">
        <input type="checkbox" id="terms">
        <label>I agree to terms</label>
    </div>

    <button onclick="signup()"> Create Account</button>
</div>

<script>
    function togglePassword() {
      let pass = document.getElementById("password");

      pass.type = (pass.type === "password") ? "text" : "password";
    }
function signup() {
  let name = document.getElementById("name").value;
  let password = document.getElementById("password").value;
  let terms = document.getElementById("terms").checked;

  if (!name || !password) {
    alert("Please fill all fields");
    return;
  }

  if (!terms) {
    alert("Accept terms first");
    return;
  }

  fetch("http://localhost:8080/public", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      userName: name,
      password: password
    })
  })
  .then(res => {
    if (res.status === 200) {
      alert("User created successfully");
            window.location.href = "signin.html";

    } else if (res.status === 409) {
      alert("User already exists");
    } else {
      alert("Something went wrong");
    }
  })
  .catch(err => {
    console.log("Error:", err);
    alert("Server error");
  });
}
</script>

</body>
</html>
