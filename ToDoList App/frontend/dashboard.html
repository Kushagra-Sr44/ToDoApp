<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f6f8;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            padding: 15px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .user {
            background: #0070f3;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .logout {
            margin-left: 10px;
            background: red;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
.grid div button{
background-color:black;
   border-radius:100px;
   font-size:20px;
   color:white;
   border:0px;
}
.grid div button i{
   color:white;

}
        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }


.Completed {
  background-color: #c8f7c5;
}

.InCompleted {
  background-color: #f7c5c5;
}

.Default {
  background-color: #f0f0f0;
}


        .delete {
            position: absolute;
            top: 8px;
            right: 8px;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
        }

        .add {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0070f3;
            color: white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 30px;
            border: none;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .box button {
            width: 100%;
            padding: 10px;
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="topbar">
    <div class="user" id="userBox"></div>
    <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">
    <h2>Todos</h2>
    <div class="grid" id="grid"></div>
</div>

<button class="add" onclick="openModal()">+</button>

<div class="modal" id="modal">
    <div class="box">
        <h3>Add Todo</h3>

        <input id="title" placeholder="Title">
        <textarea id="content" placeholder="Content"></textarea>

        <button onclick="addTodo()">Save</button>
    </div>
</div>

<script>
    let token = localStorage.getItem("authToken");
    let username = localStorage.getItem("username");

    document.getElementById("userBox").innerText = username || "Guest";

    if (!token) {
        window.location.href = "login.html";
    }

    function loadTodos() {
        fetch("http://localhost:8080/todo/getalltodo", {
            method: "GET",
            headers: {
                "Authorization": "Basic " + token
            }
        })
        .then(res => {
            if (!res.ok) throw new Error("Failed");
            return res.json();
        })
        .then(data => render(data))
        .catch(err => console.log(err));
    }

    loadTodos();

    function render(todos) {
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  if (!todos || todos.length === 0) {
    grid.innerHTML = "<p>No todos yet</p>";
    return;
  }

  todos.forEach(todo => {
    let div = document.createElement("div");

    div.className = `card ${todo.status}`;

  div.innerHTML = `
  <button onclick="statusChange('${todo.id}', 'Completed')">
    <i class="fa-solid fa-check"></i>
  </button>

  <button onclick="statusChange('${todo.id}', 'InCompleted')">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <button onclick="statusChange('${todo.id}', 'Default')">
    <i class="fa-solid fa-rotate-left"></i>
  </button>

  <button onclick="deleteTodo('${todo.id}')">
    <i class="fa-solid fa-trash"></i>
  </button>

  <h1>${todo.title}</h1>
  <p>${todo.content}</p>
`;
    grid.appendChild(div);
  });
}

    function openModal() {
        document.getElementById("modal").style.display = "flex";
    }

    window.onclick = function(e) {
        if (e.target.id === "modal") {
            document.getElementById("modal").style.display = "none";
        }
    }

    function addTodo() {
        let title = document.getElementById("title").value;
        let content = document.getElementById("content").value;

        if (!title || !content) {
            alert("Please fill all fields");
            return;
        }

        fetch("http://localhost:8080/todo", {
            method: "POST",
            headers: {
                "Authorization": "Basic " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ title, content })
        })
        .then(res => {
            if (!res.ok) throw new Error("Failed");
            return res.text();
        })
        .then(() => {
            document.getElementById("modal").style.display = "none";
            document.getElementById("title").value = "";
            document.getElementById("content").value = "";
            loadTodos();
        })
        .catch(() => alert("Error adding todo"));
    }

    function deleteTodo(id) {
        fetch(`http://localhost:8080/todo/deletebyid/${id}`, {
            method: "DELETE",
            headers: {
                "Authorization": "Basic " + localStorage.getItem("authToken")
            }
        })
        .then(res => {
            if (res.ok) loadTodos();
            else console.log("Delete failed");
        })
        .catch(err => console.log("Error:", err));
    }
         function statusChange(id, newStatus) {
  fetch(`http://localhost:8080/todo/status/${newStatus}/${id}`, {
    method: "GET",
    headers: {
      "Authorization": "Basic " + localStorage.getItem("authToken")
    }
  })
    .then(res => {
      if (!res.ok) {
        throw new Error("Request failed");
      }
      return res.text(); // no JSON parsing
    })
    .then(() => {
      loadTodos(); // success → refresh UI
    })
    .catch(err => {
      console.log("Error:", err.message);
    });
}
    function logout() {
        localStorage.removeItem("authToken");
        localStorage.removeItem("username");
        window.location.href = "index.html";
    }
</script>

</body>
</html>
