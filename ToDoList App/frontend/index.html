<!DOCTYPE html>
<html>
<head>
    <title>TickFlow Simple</title>

    <style>
        body {
          margin: 0;
          font-family: Arial;
          background: #f5f5f5;
        }
        .navbar {
          background: white;
          padding: 15px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 1px solid #ddd;
        }

        .logo {
          font-weight: bold;
          font-size: 20px;
        }

        .nav a {
          margin: 0 10px;
          text-decoration: none;
          color: black;
        }

        .btn a{
        color:white;
        text-Decoration:none;
        }


        .btn {
          padding: 8px 12px;
          border: none;
          cursor: pointer;
          border-radius:8px;
        }

        .btn-primary {
          background: #0070f3;
          color: white;
        }
        .hero {
          text-align: center;
          padding: 60px 20px;
          background: white;
        }

        .hero h1 {
          font-size: 32px;
        }

        .hero p {
          color: gray;
        }

        .features {
          display: flex;
          gap: 20px;
          padding: 40px;
          justify-content: center;
          flex-wrap: wrap;
        }

        .card {
          background: white;
          padding: 20px;
          width: 250px;
          border-radius: 8px;
          text-align: center;
        }

        .footer {
          text-align: center;
          padding: 20px;
          background: white;
          margin-top: 20px;
          border-top: 1px solid #ddd;
        }
    </style>
</head>

<body>

<div class="navbar">
    <div class="logo">TickFlow</div>
<div>
    <button class="btn btn-primary"  ><a  href="signup.html"> Sign Up</a></button>
    <button class="btn btn-primary"  ><a  href="signin.html"> Sign In</a></button>
</div>
</div>

<div class="hero">
    <h1>Manage Tasks Easily</h1>
    <p>Simple todo app for beginners and productivity</p>
    <button class="btn btn-primary" onclick="start()"><a  href="signup.html"> Get Started</a></button>
</div>

<div class="features">
    <div class="card">
        <h3>Task Management</h3>
        <p>Organize your daily tasks easily.</p>
    </div>

    <div class="card">
        <h3>Simple UI</h3>
        <p>Clean and beginner friendly design.</p>
    </div>

    <div class="card">
        <h3>Fast</h3>
        <p>Lightweight and fast to use.</p>
    </div>
</div>

<div class="footer">&copy 2026 TickFlow
</div>

<script>
    function login() {
      alert("Sign up clicked!");
    }

    function start() {
      alert("Welcome to TickFlow!");
    }
</script>

</body>
</html>
